<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>休憩打刻システム</title>
    <!-- QuaggaJS (1次元バーコードスキャナ) CDN -->
    <script src="cloudflare.com"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background: #f0f2f5; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 20px; }
        .container { width: 100%; max-width: 500px; background: white; border-radius: 12px; padding: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); text-align: center; }
        h1 { font-size: 1.5rem; margin-bottom: 15px; color: #333; }
        #interactive { position: relative; width: 100%; height: 280px; background: #000; border-radius: 8px; overflow: hidden; margin-bottom: 15px; }
        #interactive video { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; }
        .laser-line { position: absolute; top: 50%; left: 10%; width: 80%; height: 2px; background: red; box-shadow: 0 0 8px red; z-index: 10; transform: translateY(-50%); animation: blink 1s infinite; }
        @keyframes blink { 50% { opacity: 0.4; } }
        .btn { display: block; width: 100%; padding: 12px; font-size: 1rem; font-weight: bold; color: white; background: #007bff; border: none; border-radius: 6px; cursor: pointer; margin-top: 10px; }
        #result-box { margin-top: 15px; padding: 12px; border-radius: 6px; font-weight: bold; display: none; }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
        .loading { background: #fff3cd; color: #856404; }
    </style>
</head>
<body>

<div class="container">
    <h1>バーコードかざすだけ打刻</h1>
    <div id="interactive" class="viewport">
        <div class="laser-line"></div>
    </div>
    <button id="retry-btn" class="btn" style="display:none;" onclick="startScanner()">スキャン再開</button>
    <div id="result-box"></div>
</div>

<script>
    // ⚠️ここに取得した「GASのWebアプリURL」を貼り付けてください
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbzLB0lat0ynkK-oTwuaZvvlGOXmMl_-XGwZhEP-0QeYs-m3T-l8tbFov9y0Fhhhe14qlg/exec"; 
    
    let isProcessing = false;

    function startScanner() {
        document.getElementById('retry-btn').style.display = 'none';
        hideResult();
        
        Quagga.init({
            inputStream: {
                name: "Live",
                type: "LiveStream",
                target: document.querySelector('#interactive'),
                constraints: { facingMode: "environment" }
            },
            decoder: {
                readers: ["code_128_reader", "ean_reader", "code_39_reader"]
            },
            locate: true
        }, function (err) {
            if (err) {
                showResult("カメラの起動に失敗しました。権限を許可してください。", true);
                return;
            }
            Quagga.start();
        });
    }

    Quagga.onDetected(function (data) {
        if (isProcessing) return;
        const code = data.codeResult.code;
        if (code) {
            isProcessing = true;
            Quagga.stop();
            sendPunchData(code);
        }
    });

    async function sendPunchData(employeeCode) {
        showLoading(`読み込み中... [コード: ${employeeCode}]`);
        try {
            await fetch(GAS_API_URL, {
                method: "POST",
                mode: "no-cors",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ employeeCode: employeeCode })
            });
            showResult(`打刻データを送信しました。[コード: ${employeeCode}]`, false);
        } catch (error) {
            showResult("通信エラーが発生しました。", true);
        } finally {
            setTimeout(() => {
                isProcessing = false;
                startScanner();
            }, 3000);
        }
    }

    function showLoading(msg) {
        const box = document.getElementById('result-box');
        box.className = "loading"; box.innerText = msg; box.style.display = "block";
    }

    function showResult(msg, isError) {
        const box = document.getElementById('result-box');
        box.className = isError ? "error" : "success"; box.innerText = msg; box.style.display = "block";
        if(isError) document.getElementById('retry-btn').style.display = 'block';
    }

    function hideResult() { document.getElementById('result-box').style.display = "none"; }

    window.onload = startScanner;
</script>
</body>
</html>
