<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>休憩打刻システム</title>
    <!-- QuaggaJS CDN -->
    <script src="https://jsdelivr.net"></script>
    <style>
        /* CSSスタイルは適宜調整してください */
        body { font-family: sans-serif; text-align: center; }
        .camera-label { background: #28a745; color: white; padding: 10px; border-radius: 5px; cursor: pointer; }
        #file-input { display: none; }
        #result-box { margin-top: 20px; font-weight: bold; }
    </style>
</head>
<body>
    <h1>休憩打刻システム</h1>
    <label for="file-input" class="camera-label">📷 カメラでスキャン</label>
    <input type="file" id="file-input" accept="image/*" capture="environment" onchange="processAndDecode(this)">
    <div id="result-box"></div>

<script>
    const GAS_API_URL = "YOUR_GAS_URL_HERE"; 

    // 画像をリサイズしてQuaggaに渡す処理
    function processAndDecode(input) {
        if (!input.files || !input.files[0]) return;
        const file = input.files[0];
        const reader = new FileReader();

        reader.onload = function (e) {
            const img = new Image();
            img.onload = function () {
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                // バーコード解析に適したサイズ(横幅800px)にリサイズ
                const targetWidth = 800;
                const scaleFactor = targetWidth / img.width;
                canvas.width = targetWidth;
                canvas.height = img.height * scaleFactor;
                ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                
                // 縮小データを使用
                const resizedDataUrl = canvas.toDataURL('image/jpeg', 0.8);

                Quagga.decodeSingle({
                    src: resizedDataUrl,
                    decoder: { readers: ["code_128_reader", "ean_reader"] } // 必要に応じてリーダー追加
                }, function (result) {
                    if (result && result.codeResult) {
                        sendPunchData(result.codeResult.code);
                    } else {
                        document.getElementById('result-box').innerText = "認識できませんでした";
                    }
                });
            };
            img.src = e.target.result;
        };
        reader.readAsDataURL(file);
    }
    // sendPunchData関数は適宜実装
</script>
</body>
</html>
