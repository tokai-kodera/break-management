<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>休憩打刻システム</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background: #f0f2f5; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 20px; }
        .container { width: 100%; max-width: 500px; background: white; border-radius: 12px; padding: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); text-align: center; }
        h1 { font-size: 1.5rem; margin-bottom: 15px; color: #333; }
        
        #video-container { position: relative; width: 100%; height: 300px; background: #000; border-radius: 8px; overflow: hidden; margin-bottom: 15px; }
        #video { width: 100%; height: 100%; object-fit: cover; }
        
        .laser-line { position: absolute; top: 50%; left: 10%; width: 80%; height: 2px; background: red; box-shadow: 0 0 8px red; z-index: 10; transform: translateY(-50%); animation: blink 1s infinite; }
        @keyframes blink { 50% { opacity: 0.4; } }

        .btn { display: block; width: 100%; padding: 12px; font-size: 1rem; font-weight: bold; color: white; background: #007bff; border: none; border-radius: 6px; cursor: pointer; margin-top: 10px; }
        #result-box { margin-top: 15px; padding: 12px; border-radius: 6px; font-weight: bold; display: none; text-align: center; }
        .success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .loading { background: #fff3cd; color: #856404; border: 1px solid #ffeeba; }
    </style>
</head>
<body>

<div class="container">
    <h1>バーコードかざすだけ打刻</h1>
    
    <div id="video-container">
        <video id="video" autoplay playsinline muted></video>
        <div class="laser-line"></div>
    </div>

    <button id="retry-btn" class="btn" style="display:none;" onclick="startEngine()">スキャン再開</button>
    <div id="result-box"></div>
</div>

<script>
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbzLB0lat0ynkK-oTwuaZvvlGOXmMl_-XGwZhEP-0QeYs-m3T-l8tbFov9y0Fhhhe14qlg/exec"; 
    
    let activeStream = null;
    let scanLoopId = null;
    let isProcessing = false;
    let isNativeSupported = false;
    let barcodeDetector = null;
    let zxingReader = null;

    // 起動エンジンの選定（AndroidかiPhoneかを自動判別）
    async function startEngine() {
        document.getElementById('retry-btn').style.display = 'none';
        hideResult();
        isProcessing = false;
        stopScanner();

        // 1. Androidなどで標準機能(BarcodeDetector)が動くかチェック
        if ('BarcodeDetector' in window) {
            try {
                barcodeDetector = new BarcodeDetector({ formats: ['code_128', 'ean_13', 'code_39'] });
                isNativeSupported = true;
                initCamera('native'); // Android用ネイティブモードで起動
                return;
            } catch(e) { isNativeSupported = false; }
        }

        // 2. iPhoneなどの場合、バックアップ用のZXingライブラリをその場で動的に読み込む
        showLoading("iOS互換モードを起動中...");
        if (!window.ZXing) {
            await new Promise((resolve) => {
                const script = document.createElement('script');
                script.src = "https://unpkg.com";
                script.onload = resolve;
                document.head.appendChild(script);
            });
        }
        initCamera('zxing'); // iPhone用互換モードで起動
    }

    // カメラストリームの取得と再生
    async function initCamera(mode) {
        hideResult();
        const videoElement = document.getElementById('video');

        try {
            // 最も成功率の高い背面カメラ指定
            const stream = await navigator.mediaDevices.getUserMedia({
                video: { facingMode: "environment", width: { ideal: 1280 }, height: { ideal: 720 } }
            });

            activeStream = stream;
            videoElement.srcObject = stream;
            await videoElement.play();

            if (mode === 'native') {
                // Android用の高速ループ開始
                startNativeLoop();
            } else {
                // iPhone用のZXing処理開始
                startZXingLoop();
            }

        } catch (error) {
            console.error(error);
            showResult("カメラの起動に失敗しました。SafariやChromeの設定でカメラ権限を『許可』にしてください。", true);
        }
    }

    // 【Android用】内蔵エンジンによる高速処理ループ
    function startNativeLoop() {
        const videoElement = document.getElementById('video');
        async function scan() {
            if (isProcessing) return;
            if (videoElement.readyState === videoElement.HAVE_ENOUGH_DATA) {
                try {
                    const barcodes = await barcodeDetector.detect(videoElement);
                    if (barcodes.length > 0 && barcodes[0].rawValue) {
                        isProcessing = true;
                        stopScanner();
                        sendPunchData(barcodes[0].rawValue);
                        return;
                    }
                } catch (err) {}
            }
            scanLoopId = requestAnimationFrame(scan);
        }
        scanLoopId = requestAnimationFrame(scan);
    }

    // 【iPhone用】ZXingによる処理ループ
    function startZXingLoop() {
        zxingReader = new ZXing.BrowserBarcodeReader();
        zxingReader.decodeFromVideoElement(document.getElementById('video'), (result, err) => {
            if (isProcessing) return;
            if (result) {
                const code = result.getText();
                if (code) {
                    isProcessing = true;
                    stopScanner();
                    sendPunchData(code);
                }
            }
        });
    }

    // スキャナーとストリームの完全停止処理
    function stopScanner() {
        if (scanLoopId) { cancelAnimationFrame(scanLoopId); scanLoopId = null; }
        if (zxingReader) { zxingReader.reset(); zxingReader = null; }
        if (activeStream) {
            activeStream.getTracks().forEach(track => track.stop());
            activeStream = null;
        }
        const videoElement = document.getElementById('video');
        if (videoElement) { videoElement.srcObject = null; }
    }

    // GAS APIへの自動打刻送信
    async function sendPunchData(employeeCode) {
        showLoading(`送信中... [コード: ${employeeCode}]`);
        try {
            await fetch(GAS_API_URL, {
                method: "POST",
                mode: "no-cors",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ employeeCode: employeeCode })
            });
            showResult(`打刻完了！<br>社員コード: ${employeeCode}`, false);
        } catch (error) {
            showResult("通信エラーが発生しました。", true);
        } finally {
            // 3秒後に自動でカメラを再起動して次の人に備える
            setTimeout(() => {
                startEngine();
            }, 3000);
        }
    }

    function showLoading(msg) {
        const box = document.getElementById('result-box');
        box.className = "loading"; box.innerHTML = msg; box.style.display = "block";
    }

    function showResult(msg, isError) {
        const box = document.getElementById('result-box');
        box.className = isError ? "error" : "success"; box.innerHTML = msg; box.style.display = "block";
        if(isError) document.getElementById('retry-btn').style.display = 'block';
    }

    function hideResult() { document.getElementById('result-box').style.display = "none"; }

    window.onload = startEngine;
</script>
</body>
</html>
