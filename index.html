<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>休憩打刻システム</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:sans-serif;
}

body{
    background:#f0f2f5;
    display:flex;
    flex-direction:column;
    align-items:center;
    min-height:100vh;
    padding:20px;
}

.container{
    width:100%;
    max-width:500px;
    background:#fff;
    border-radius:12px;
    padding:20px;
    box-shadow:0 4px 6px rgba(0,0,0,.1);
    text-align:center;
}

h1{
    font-size:1.5rem;
    margin-bottom:15px;
    color:#333;
}

#interactive{
    position:relative;
    width:100%;
    height:300px;
    background:#000;
    border-radius:8px;
    overflow:hidden;
    margin-bottom:15px;
}

#interactive video{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
}

.laser-line{
    position:absolute;
    top:50%;
    left:10%;
    width:80%;
    height:2px;
    background:red;
    box-shadow:0 0 8px red;
    z-index:100;
    transform:translateY(-50%);
    animation:blink 1s infinite;
    pointer-events:none;
}

@keyframes blink{
    50%{ opacity:.4; }
}

.btn{
    display:block;
    width:100%;
    padding:12px;
    font-size:1rem;
    font-weight:bold;
    color:#fff;
    background:#007bff;
    border:none;
    border-radius:6px;
    cursor:pointer;
    margin-top:10px;
}

#result-box{
    margin-top:15px;
    padding:16px;
    border-radius:8px;
    font-weight:bold;
    display:none;
    text-align:left;
    box-shadow:inset 0 2px 4px rgba(0,0,0,.05);
}

.success{
    background:#e2f0d9;
    color:#385723;
    border:1px solid #c5e0b4;
}

.error{
    background:#fce4d6;
    color:#c65911;
    border:1px solid #f8cbad;
}

.loading{
    background:#fff2cc;
    color:#7f6000;
    border:1px solid #ffe599;
    text-align:center !important;
}

.result-title{
    font-size:1.2rem;
    font-weight:bold;
    margin-bottom:8px;
}

.result-item{
    font-size:.95rem;
    margin:4px 0;
    font-weight:normal;
}

.time-badge{
    display:block;
    margin-top:12px;
    padding:10px;
    background:#fff;
    border-left:5px solid #007bff;
    border-radius:0 4px 4px 0;
    font-size:1rem;
    font-weight:bold;
}

.time-badge span{
    color:#d83b01;
    font-size:1.5rem;
    float:right;
    font-weight:800;
}
</style>
</head>

<body>

<div class="container">

    <h1>バーコードかざすだけ打刻</h1>

    <div id="interactive">
        <div class="laser-line"></div>
    </div>

    <button id="retry-btn"
            class="btn"
            style="display:none;"
            onclick="startCamera()">
        スキャン再開
    </button>

    <div id="result-box"></div>

</div>

<script>
/* =========================================================
   BarcodeScanner
========================================================= */

window.BarcodeScanner = (function(){

    const C39_CHARS =
        "0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ-. *$/+%";

    const C39_PATTERNS = [
        0x034,0x120,0x030,0x110,0x014,0x104,0x024,0x005,0x101,0x021,
        0x140,0x050,0x150,0x044,0x144,0x054,0x00c,0x10c,0x02c,0x012,
        0x112,0x032,0x122,0x042,0x142,0x052,0x003,0x103,0x023,0x00b,
        0x10b,0x02b,0x11a,0x02a,0x12a,0x04a,0x009,0x109,0x029,0x006,
        0x060,0x068,0x0a0
    ];

    function decode(imageData){

        const width  = imageData.width;
        const height = imageData.height;
        const data   = imageData.data;

        const rows = [
            Math.floor(height * 0.45),
            Math.floor(height * 0.50),
            Math.floor(height * 0.55)
        ];

        for(const y of rows){

            let brightness = new Uint8Array(width);

            let min = 255;
            let max = 0;

            for(let x=0;x<width;x++){

                const idx = 4 * (y * width + x);

                const b =
                    data[idx] * 0.299 +
                    data[idx+1] * 0.587 +
                    data[idx+2] * 0.114;

                brightness[x] = b;

                if(b < min) min = b;
                if(b > max) max = b;
            }

            if(max - min < 35){
                continue;
            }

            const threshold = (min + max) / 2;

            const binary = new Uint8Array(width);

            for(let x=0;x<width;x++){
                binary[x] = brightness[x] < threshold ? 1 : 0;
            }

            let runs = [];

            let current = binary[0];
            let len = 1;

            for(let x=1;x<width;x++){

                if(binary[x] === current){
                    len++;
                }else{
                    runs.push({
                        isBlack: current === 1,
                        width: len
                    });

                    current = binary[x];
                    len = 1;
                }
            }

            runs.push({
                isBlack: current === 1,
                width: len
            });

            const code39 = tryCODE39(runs);

            if(code39){
                return code39;
            }
        }

        return null;
    }

    function tryCODE39(runs){

        for(let i=0;i<runs.length-9;i++){

            if(!runs[i].isBlack){
                continue;
            }

            let elements = [];

            for(let j=0;j<9;j++){
                elements.push(runs[i+j].width);
            }

            const sorted =
                [...elements].sort((a,b)=>a-b);

            const threshold =
                (sorted[3] + sorted[4]) / 2;

            let bit = 0;

            for(let j=0;j<9;j++){

                bit <<= 1;

                if(elements[j] > threshold){
                    bit |= 1;
                }
            }

            const match =
                C39_PATTERNS.indexOf(bit);

            if(match === -1){
                continue;
            }

            if(C39_CHARS[match] !== '*'){
                continue;
            }

            let result = "";
            let k = i + 10;

            while(k <= runs.length - 9){

                if(runs[k] && !runs[k].isBlack){
                    k++;
                }

                let ce = [];

                for(let j=0;j<9;j++){

                    if(!runs[k+j]){
                        break;
                    }

                    ce.push(runs[k+j].width);
                }

                if(ce.length < 9){
                    break;
                }

                const cs =
                    [...ce].sort((a,b)=>a-b);

                const ct =
                    (cs[3] + cs[4]) / 2;

                let cb = 0;

                for(let j=0;j<9;j++){

                    cb <<= 1;

                    if(ce[j] > ct){
                        cb |= 1;
                    }
                }

                const idx =
                    C39_PATTERNS.indexOf(cb);

                if(idx === -1){
                    break;
                }

                const ch = C39_CHARS[idx];

                if(ch === '*'){

                    if(result.length > 0){
                        return result;
                    }

                    break;
                }

                result += ch;

                k += 10;
            }
        }

        return null;
    }

    return {
        decode
    };

})();
</script>

<script>
/* =========================================================
   Main
========================================================= */

const GAS_API_URL =
    "https://script.google.com/macros/s/AKfycbzLB0lat0ynkK-oTwuaZvvlGOXmMl_-XGwZhEP-0QeYs-m3T-l8tbFov9y0Fhhhe14qlg/exec";

let activeStream = null;
let scanTimer = null;
let isProcessing = false;

async function startCamera(){

    if(isProcessing){
        return;
    }

    hideResult();

    document.getElementById("retry-btn").style.display = "none";

    stopCamera();

    const container =
        document.getElementById("interactive");

    const oldVideo =
        container.querySelector("video");

    if(oldVideo){
        oldVideo.remove();
    }

    const video =
        document.createElement("video");

    video.autoplay = true;
    video.playsInline = true;
    video.muted = true;

    container.appendChild(video);

    try{

        const stream =
            await navigator.mediaDevices.getUserMedia({
                video:{
                    facingMode:{
                        ideal:"environment"
                    },
                    width:{ ideal:1280 },
                    height:{ ideal:720 }
                },
                audio:false
            });

        activeStream = stream;

        video.srcObject = stream;

        await video.play();

        startScanLoop(video);

    }catch(err){

        console.error(err);

        showResult(
            `
            <div class="result-title">
                カメラ起動エラー
            </div>

            <div class="result-item">
                カメラ権限を許可してください
            </div>
            `,
            true
        );
    }
}

function startScanLoop(video){

    const canvas =
        document.createElement("canvas");

    const ctx =
        canvas.getContext("2d", {
            willReadFrequently:true
        });

    async function tick(){

        if(isProcessing){
            return;
        }

        if(
            video.readyState >= 2 &&
            video.videoWidth > 0
        ){

            canvas.width  = video.videoWidth;
            canvas.height = video.videoHeight;

            ctx.drawImage(
                video,
                0,
                0,
                canvas.width,
                canvas.height
            );

            const imageData =
                ctx.getImageData(
                    0,
                    0,
                    canvas.width,
                    canvas.height
                );

            const result =
                window.BarcodeScanner.decode(imageData);

            if(result){

                isProcessing = true;

                navigator.vibrate?.(120);

                stopCamera();

                await sendPunchData(result);

                return;
            }
        }

        scanTimer =
            setTimeout(tick, 80);
    }

    tick();
}

function stopCamera(){

    if(scanTimer){
        clearTimeout(scanTimer);
        scanTimer = null;
    }

    if(activeStream){

        activeStream
            .getTracks()
            .forEach(track => track.stop());

        activeStream = null;
    }

    const video =
        document.querySelector("#interactive video");

    if(video){

        video.pause();

        video.srcObject = null;

        video.remove();
    }
}

async function sendPunchData(employeeCode){

    const cleanCode =
        employeeCode.replace(/\*/g,"").trim();

    showLoading(`
        データ照合中...<br>
        [コード: ${cleanCode}]
    `);

    try{

        const response =
            await fetch(GAS_API_URL, {
                method:"POST",
                mode:"cors",
                headers:{
                    "Content-Type":
                    "application/x-www-form-urlencoded"
                },
                body:new URLSearchParams({
                    employeeCode: cleanCode
                })
            });

        if(!response.ok){
            throw new Error(
                "HTTP ERROR : " + response.status
            );
        }

        const data =
            await response.json();

        if(data.success){

            const title =
                data.action === "break_start"
                ? "🟢 休憩開始を記録しました"
                : "🔴 休憩終了を記録しました";

            showResult(
                `
                <div class="result-title">
                    ${title}
                </div>

                <div class="result-item">
                    従業員名:
                    <strong>${escapeHtml(data.employeeName)}</strong>
                </div>

                <div class="result-item">
                    社員コード:
                    <strong>${escapeHtml(cleanCode)}</strong>
                </div>

                <div class="time-badge">
                    過去12時間の合計休憩時間
                    <span>${data.totalBreakTime || 0} 分</span>
                </div>
                `,
                false
            );

        }else{

            showResult(
                `
                <div class="result-title">
                    打刻エラー
                </div>

                <div class="result-item">
                    ${escapeHtml(data.message || "不明なエラー")}
                </div>
                `,
                true
            );
        }

    }catch(err){

        console.error(err);

        showResult(
            `
            <div class="result-title">
                通信エラー
            </div>

            <div class="result-item">
                サーバー通信に失敗しました
            </div>
            `,
            true
        );

    }finally{

        setTimeout(()=>{
            isProcessing = false;
            startCamera();
        },3000);
    }
}

function escapeHtml(str){

    return String(str)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}

function showLoading(msg){

    const box =
        document.getElementById("result-box");

    box.className = "loading";
    box.innerHTML = msg;
    box.style.display = "block";
}

function showResult(html, isError){

    const box =
        document.getElementById("result-box");

    box.className =
        isError ? "error" : "success";

    box.innerHTML = html;

    box.style.display = "block";

    if(isError){
        document.getElementById("retry-btn")
            .style.display = "block";
    }
}

function hideResult(){

    document.getElementById("result-box")
        .style.display = "none";
}

window.addEventListener(
    "load",
    startCamera
);
</script>

</body>
</html>
